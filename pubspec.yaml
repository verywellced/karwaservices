name: karwaservices
description: "The Official Mobile App of Karwa Services"
publish_to: "none"

# The version number is used to identify different versions.
version: 1.0.0+1

environment:
  sdk: ^3.10.3

# Depedencies specify other packages that your package needs in order to work.
